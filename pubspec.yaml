name: lifemate
description: "LifeMate — Personal Finance & Daily Assistant App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ────────────────────────────────────────────────────
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_app_check: ^0.5.0

  # ── State management ────────────────────────────────────────────
  # flutter_riverpod: reactive state management without code generation
  # (riverpod_generator requires Dart >=3.12; we use manual providers)
  flutter_riverpod: ^3.3.2

  # ── Navigation ──────────────────────────────────────────────────
  go_router: ^17.5.0

  # ── UI ──────────────────────────────────────────────────────────
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  gap: ^3.0.1

  # ── Utilities ───────────────────────────────────────────────────
  intl: ^0.20.2 # pinned by flutter_localizations
  shared_preferences: ^2.5.5
  logger: ^2.8.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.4.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from the .arb files.
  generate: true

  assets:
    - assets/images/
    - assets/icons/
